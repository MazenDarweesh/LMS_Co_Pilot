services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_copilot_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lms_co_pilot
      - QDRANT_URL=http://qdrant:6333
      - ENVIRONMENT=production
      - SERVICE_TOKEN=MySuperSecretToken2026
      - LMS_BASE_URL=http://dynamicprolearn-app:8080
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - copilot_net
      - lms_shared_network

  db:
    image: postgres:16-alpine
    container_name: lms_copilot_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lms_co_pilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - copilot_net

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: lms_copilot_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - copilot_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lms_copilot_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - copilot_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: lms_copilot_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - copilot_net

networks:
  copilot_net:
    driver: bridge
  lms_shared_network:
    external: true

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
