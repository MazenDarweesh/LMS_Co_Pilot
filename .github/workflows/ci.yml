name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_co_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
          - 6334:6334

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_co_pilot
      QDRANT_URL: http://localhost:6333
      JWT_SECRET: supersecretjwtkeyforstaging2026
      SERVICE_TOKEN: MySuperSecretToken2026
      LMS_BASE_URL: http://localhost:8080
      GEMINI_API_KEY: dummy_test_gemini_key
      ENVIRONMENT: testing
      RERANKER_TYPE: flashrank
      FLASHRANK_MODEL_NAME: miniReranker_arabic_v1
      SEMANTIC_CACHE_ENABLED: true
      SEMANTIC_CACHE_THRESHOLD: 0.92
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8080"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Wait for Qdrant service readiness
        run: |
          echo "Waiting for Qdrant to be fully operational..."
          timeout 30 bash -c 'until curl -sf http://localhost:6333/readyz; do sleep 1; done'
          echo "Qdrant is healthy and accepting connections."

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify syntax & compile bytecode
        run: uv run python -m compileall src/ tests/

      - name: Run automated test suite (46 tests)
        run: uv run pytest tests/ -v

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        run: docker build -t lms-co-pilot:ci-check .
