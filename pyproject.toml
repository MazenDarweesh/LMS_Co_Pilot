[project]
name = "lms-co-pilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mazen darweesh", email = "mazentharwatfathy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "audioop-lts>=0.2.2",
    "cachetools>=5.5.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "flashrank>=0.2.9",
    "google-genai>=2.16.0",
    "groq>=1.6.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.3.7",
    "langchain-google-vertexai>=3.2.4",
    "langgraph>=0.2.14",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "pydub>=0.25.1",
    "pyjwt[crypto]>=2.13.0",
    "qdrant-client[fastembed]>=1.13",
    "ragas>=0.2",
    "sentence-transformers>=5.7.0",
    "slowapi>=0.1.10",
    "sse-starlette>=3.4.6",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.1",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
lms-co-pilot = "lms_co_pilot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "locust>=2.46.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
